<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}ScriptVerify{% endblock %} · Iqra University</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <header class="head">
        <a href="{{ url_for('main.index') }}" class="brand">
            SCRIPT<sup>VERIFY</sup>
            <small>Iqra University · CS</small>
        </a>
        <nav class="nav-strip">
            <a href="{{ url_for('main.index') }}"
               {% if request.endpoint == 'main.index' %}class="active"{% endif %}>Dashboard</a>
            <a href="{{ url_for('batch.batch_list') }}"
               {% if request.endpoint and request.endpoint.startswith('batch') %}class="active"{% endif %}>Batches</a>
            <a href="{{ url_for('main.pairwise') }}"
               {% if request.endpoint == 'main.pairwise' %}class="active"{% endif %}>Pairwise</a>
            {% if current_user.is_authenticated and current_user.is_admin %}
            <a href="{{ url_for('admin.teacher_list') }}"
               {% if request.endpoint and request.endpoint.startswith('admin') %}class="active"{% endif %}>Admin</a>
            {% endif %}
        </nav>
        <div class="head-right">
            <span class="user-blob">{{ current_user.name.split()[0]|upper }}</span>
            <form method="POST" action="{{ url_for('auth.logout') }}">
                <button type="submit" class="btn-logout">Logout</button>
            </form>
        </div>
    </header>

    {% block content %}{% endblock %}

    {% block scripts %}{% endblock %}
</body>
</html>
