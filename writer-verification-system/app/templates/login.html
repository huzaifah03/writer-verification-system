<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In · ScriptVerify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="login-wrap">
    <div class="login-card">
        <div class="brand-lg">SCRIPT<sup>VERIFY</sup></div>
        <p class="subtitle">Iqra University · CS Department<br>Sign in with your teacher account to continue.</p>

        {% for msg in get_flashed_messages(category_filter=["error"]) %}
        <div class="login-error">{{ msg }}</div>
        {% endfor %}

        <form method="POST" action="{{ url_for('auth.login') }}">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email"
                   value="{{ request.form.get('email', '') }}"
                   placeholder="teacher@iqra.edu.pk"
                   required autofocus />

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="••••••••••••" required />

            <button type="submit" class="btn-login">Sign in →</button>
        </form>
    </div>
</div>
</body>
</html>
