<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — Writer Verification System</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: #fff;
            border-radius: 10px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.08);
        }
        h1 { font-size: 1.4rem; color: #1a202c; margin-bottom: 0.25rem; }
        .subtitle { font-size: 0.85rem; color: #718096; margin-bottom: 1.75rem; }
        label { display: block; font-size: 0.875rem; font-weight: 600;
                color: #2d3748; margin-bottom: 0.35rem; }
        input[type="email"], input[type="password"] {
            width: 100%; padding: 0.6rem 0.75rem;
            border: 1px solid #cbd5e0; border-radius: 6px;
            font-size: 0.95rem; margin-bottom: 1.1rem;
            outline: none; transition: border-color 0.15s;
        }
        input:focus { border-color: #4a6cf7; }
        button[type="submit"] {
            width: 100%; padding: 0.7rem;
            background: #4a6cf7; color: #fff;
            border: none; border-radius: 6px;
            font-size: 1rem; font-weight: 600; cursor: pointer;
            transition: background 0.2s;
        }
        button[type="submit"]:hover { background: #3a5ce4; }
        .error-list { margin-bottom: 1rem; }
        .error-list p {
            background: #fff5f5; border: 1px solid #feb2b2;
            border-radius: 6px; padding: 0.6rem 0.9rem;
            color: #c53030; font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Writer Verification System</h1>
        <p class="subtitle">Sign in with your teacher account to continue.</p>

        {% set errors = get_flashed_messages(category_filter=["error"]) %}
        {% if errors %}
        <div class="error-list">
            {% for msg in errors %}
            <p>{{ msg }}</p>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('auth.login') }}">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email"
                   value="{{ request.form.get('email', '') }}"
                   placeholder="teacher@iqra.edu.pk" required autofocus />

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="••••••••••••" required />

            <button type="submit">Sign in</button>
        </form>
    </div>
</body>
</html>
