<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Writer Verification System{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">✍️ Writer Verification System</div>
        <div class="nav-links">

    </nav>

    <main class="container">

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
